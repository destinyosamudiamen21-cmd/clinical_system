<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encounter Summary — Demo Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
    <style>
      /* Screen */
      body {
        background: #f4f6fb;
      }
      .sheet {
        background: #fff;
        max-width: 900px;
        margin: 24px auto;
        padding: 40px 48px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
      }
      .doc-block {
        margin-bottom: 28px;
      }
      .doc-block h6 {
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 12px;
        color: #1a3c6e;
        border-bottom: 2px solid #1a3c6e;
        padding-bottom: 4px;
        margin-bottom: 12px;
      }
      .field {
        margin-bottom: 8px;
      }
      .field-label {
        font-weight: 600;
        font-size: 13px;
      }
      .field-value {
        font-size: 14px;
        white-space: pre-wrap;
      }
      .amend {
        border-left: 3px solid #adb5bd;
        padding-left: 12px;
        margin: 6px 0 6px 12px;
        font-size: 13px;
      }
      .empty {
        color: #999;
        font-style: italic;
        font-size: 13px;
      }

      /* Print — strip anything that isn't the record itself */
      @media print {
        body {
          background: #fff;
        }
        .no-print {
          display: none !important;
        }
        .sheet {
          box-shadow: none;
          margin: 0;
          padding: 0;
          max-width: 100%;
        }
        /* Keep a document's heading with its content across page breaks */
        .doc-block {
          page-break-inside: avoid;
        }
        h6 {
          page-break-after: avoid;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary px-4 no-print">
      <span class="navbar-brand fw-bold">Encounter Summary</span>
      <div class="d-flex gap-2">
        <button class="btn btn-light btn-sm" onclick="window.print()">
          Print
        </button>
        <a
          href="#"
          onclick="history.back()"
          class="btn btn-outline-light btn-sm"
          >Back</a
        >
      </div>
    </nav>

    <div class="sheet" id="sheet">
      <p class="text-muted">Loading…</p>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/encounter_summary.js"></script>
  </body>
</html>
