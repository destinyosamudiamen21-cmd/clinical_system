<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pharmacy — Demo Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary px-4">
      <span class="navbar-brand fw-bold">Pharmacy</span>
      <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </nav>

    <div class="container mt-4" style="max-width: 760px">
      <!-- Step 1: find the patient -->
      <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
          <h6 class="fw-bold mb-3">1. Find the patient</h6>
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              id="patientSearch"
              placeholder="Enter patient name..."
            />
            <button class="btn btn-primary" id="searchBtn">Search</button>
          </div>
          <div id="patientResults" class="mt-3"></div>
        </div>
      </div>

      <!-- Step 2: enter the code -->
      <div
        class="card shadow-sm border-0 mb-3"
        id="codeCard"
        style="display: none"
      >
        <div class="card-body">
          <h6 class="fw-bold mb-1">2. Enter the pharmacy code</h6>
          <p class="text-muted small mb-3">
            Patient: <span id="selectedPatientName"></span>
          </p>
          <div class="input-group">
            <input
              type="text"
              class="form-control text-uppercase"
              id="codeInput"
              placeholder="e.g. A3F9C1"
              style="letter-spacing: 2px"
            />
            <button class="btn btn-success" id="lookupBtn">
              View Prescription
            </button>
          </div>
          <div id="lookupError" class="text-danger small mt-2"></div>
        </div>
      </div>

      <!-- Step 3: the prescription -->
      <div id="prescriptionResult"></div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/pharmacy.js"></script>
  </body>
</html>
