<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff — Demo Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary px-4">
      <span class="navbar-brand fw-bold">Staff Accounts</span>
      <a href="/" class="btn btn-outline-light btn-sm">Dashboard</a>
    </nav>

    <div class="container mt-4" style="max-width: 900px">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Staff</h5>
        <button class="btn btn-primary btn-sm" id="showStaffFormBtn">
          + Add Staff
        </button>
      </div>

      <!-- Create form, hidden until needed -->
      <div id="staffForm" class="card p-3 mb-4" style="display: none">
        <h6 class="mb-3">New Staff Account</h6>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label small">Full Name</label>
            <input type="text" class="form-control" id="s_full_name" />
          </div>
          <div class="col-md-6">
            <label class="form-label small">Role</label>
            <select class="form-select" id="s_role">
              <option value="doctor">Doctor</option>
              <option value="nurse">Nurse</option>
              <option value="receptionist">Receptionist</option>
              <option value="pharmacy">Pharmacy</option>
              <option value="admin">Admin</option>
              <option value="super_admin">Super Admin</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small">Email</label>
            <input type="email" class="form-control" id="s_email" />
          </div>
          <div class="col-md-6">
            <label class="form-label small">Password</label>
            <input type="password" class="form-control" id="s_password" />
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-success btn-sm" id="saveStaffBtn">
            Create Account
          </button>
          <button class="btn btn-secondary btn-sm" id="cancelStaffBtn">
            Cancel
          </button>
        </div>
        <div id="staffError" class="text-danger small mt-2"></div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
              </tr>
            </thead>
            <tbody id="staffTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/staff.js"></script>
  </body>
</html>
